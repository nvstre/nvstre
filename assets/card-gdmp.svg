<rect class="run" x="2" y="2" width="576" height="226" rx="20" fill="none" stroke="url(#ln)" stroke-width="2.5" filter="url(#gl)"/>
<rect class="run" x="2" y="2" width="576" height="226" rx="20" fill="none" stroke="url(#ln)" stroke-width="1.5"/>
<g class="ic" transform="translate(34 30)"><g fill="none" stroke="#b07cff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M20 5l15 27H5z"/><path d="M20 16l6 11H14z"/></g></g>
<text class="h" x="88" y="62">GDMP</text>
<rect x="434" y="38" width="112" height="28" rx="14" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.4"/>
<circle class="dot" cx="449" cy="52" r="4" fill="#f59e0b"/>
<circle cx="449" cy="52" r="4" fill="#f59e0b"/>
<text class="s" x="460" y="56.5">BUILDING</text>
<text class="d" x="34" y="122">Geometry Dash Multiplayer — a launcher for</text><text class="d" x="34" y="146">community servers. FiveM energy, but for GD.</text>
