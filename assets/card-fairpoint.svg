<style>
  .h{font:800 28px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#ece9f5}
  .d{font:400 16.5px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#8b86a3}
