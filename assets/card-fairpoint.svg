    <stop offset="0" stop-color="#f72585" stop-opacity="0.22"/>
    <stop offset="0.55" stop-color="#0e0c16" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#f72585"/><stop offset="1" stop-color="#f72585"/></linearGradient>
  <filter id="gl" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
