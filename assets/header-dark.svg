<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<style>
  .n{font:700 112px -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#f0f6fc;letter-spacing:-4px;animation:in 1.4s cubic-bezier(.16,1,.3,1) both}
  .l{font:400 18px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#7d8590;letter-spacing:1px;animation:fade 1.2s ease .6s both}
  .r{transform-box:fill-box;transform-origin:left;animation:draw 1.4s cubic-bezier(.65,0,.35,1) .35s both}
  .d{animation:fade .6s ease 1.5s both, pulse 3s ease-in-out 2.1s infinite}
  @keyframes in{from{opacity:0;transform:translateY(18px);letter-spacing:6px}to{opacity:1;transform:none;letter-spacing:-4px}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes pulse{50%{opacity:.25}}
</style>
<text class="n" x="40" y="160">mateo.</text>
<rect class="r" x="44" y="196" width="1112" height="1" fill="#30363d"/>
<circle class="d" cx="1152" cy="196.5" r="4" fill="#f0f6fc"/>
<text class="l" x="44" y="244">builds things. ships them.</text>
</svg>