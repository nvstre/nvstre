<rect class="run" x="2" y="2" width="576" height="226" rx="20" fill="none" stroke="url(#ln)" stroke-width="2.5" filter="url(#gl)"/>
<rect class="run" x="2" y="2" width="576" height="226" rx="20" fill="none" stroke="url(#ln)" stroke-width="1.5"/>
<g class="ic" transform="translate(34 30)"><g fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M22 3L8 22h11l-3 15 16-21H21z"/></g></g>
<text class="h" x="88" y="62">fit-tracker</text>
<rect x="463" y="38" width="83" height="28" rx="14" fill="#94a3b8" fill-opacity="0.12" stroke="#94a3b8" stroke-opacity="0.4"/>
<circle class="dot" cx="478" cy="52" r="4" fill="#94a3b8"/>
<circle cx="478" cy="52" r="4" fill="#94a3b8"/>
<text class="s" x="489" y="56.5">EARLY</text>
<text class="d" x="34" y="122">Personal gym, food and body tracker that</text><text class="d" x="34" y="146">pulls smart-scale data from Apple Health.</text>
