<svg xmlns="http://www.w3.org/2000/svg" width="580" height="230" viewBox="0 0 580 230">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22c55e" stop-opacity="0.22"/>
    <stop offset="0.55" stop-color="#0e0c16" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#f72585"/></linearGradient>
  <filter id="gl" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
  .h{font:800 28px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#ece9f5}
  .d{font:400 16.5px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#8b86a3}
  .t{font:600 12.5px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#22c55e}
  .s{font:700 12px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#94a3b8;letter-spacing:1.5px}
  .run{stroke-dasharray:140 1464;animation:run 6s linear infinite}
  @keyframes run{to{stroke-dashoffset:-1604}}
  .dot{animation:ping 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3);opacity:0}}
  .ic{animation:float 4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-4px)}}
  .all{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
<g class="all">
