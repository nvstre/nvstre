<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
<defs>
  <linearGradient id="nameb" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#4cc9f0"/>
    <stop offset="0.33" stop-color="#f72585"/>
    <stop offset="0.66" stop-color="#7b2cbf"/>
    <stop offset="1" stop-color="#4cc9f0"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#07060b" stop-opacity="1"/>
    <stop offset="1" stop-color="#07060b" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="hz" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f72585" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#f72585"/>
    <stop offset="1" stop-color="#f72585" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#f72585" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#f72585" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clip"><rect width="1200" height="440" rx="22"/></clipPath>
  <pattern id="noise" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#fff" opacity="0.025"/>
  </pattern>
</defs>
<style>
  .blob{animation:drift 16s ease-in-out infinite alternate}
  .b2{animation-duration:20s;animation-delay:-6s}
  .b3{animation-duration:24s;animation-delay:-12s}
  @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(120px,40px) scale(1.25)}100%{transform:translate(-90px,-30px) scale(0.9)}}
  .grid{animation:grid 1.6s linear infinite}
  @keyframes grid{from{transform:translateY(0)}to{transform:translateY(20px)}}
  .name{font:900 128px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;letter-spacing:18px;animation:in 1.2s cubic-bezier(.2,.8,.2,1) both}
  .tag{font:600 15px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;letter-spacing:6px;fill:#8b86a3;animation:in 1.2s .3s cubic-bezier(.2,.8,.2,1) both}
  @keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  .rot{font:500 22px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#ece9f5;opacity:0;animation:rot 12.8s infinite}
  @keyframes rot{0%{opacity:0;transform:translateY(14px);filter:blur(4px)}3.00%{opacity:1;transform:translateY(0);filter:blur(0)}21.25%{opacity:1;transform:translateY(0);filter:blur(0)}25.00%{opacity:0;transform:translateY(-14px);filter:blur(4px)}100%{opacity:0}}
  .caret{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .scan{animation:scan 5s linear infinite}
  @keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(500px)}}
  .pulse{animation:pulse 4s ease-in-out infinite;transform-origin:600px 320px}
  @keyframes pulse{50%{opacity:.55;transform:scale(1.08)}}
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="440" fill="#07060b"/>
  <g filter="url(#blur)" opacity="0.75">
    <circle class="blob" cx="260" cy="120" r="170" fill="#7b2cbf"/>
    <circle class="blob b2" cx="940" cy="110" r="190" fill="#f72585" opacity="0.7"/>
    <circle class="blob b3" cx="620" cy="360" r="160" fill="#4cc9f0" opacity="0.45"/>
  </g>
  <ellipse class="pulse" cx="600" cy="320" rx="300" ry="110" fill="url(#sun)"/>
  <g transform="translate(0 310)">
    <g class="grid" stroke="#f72585" stroke-opacity="0.22" stroke-width="1"><line x1="0" x2="1200" y1="0" y2="0"/><line x1="0" x2="1200" y1="20" y2="20"/><line x1="0" x2="1200" y1="40" y2="40"/><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="100" y2="100"/><line x1="0" x2="1200" y1="120" y2="120"/></g>
    <g stroke="#f72585" stroke-opacity="0.18" stroke-width="1"><line x1="-40.0" y1="0" x2="-3560.0" y2="140"/><line x1="0.0" y1="0" x2="-3300.0" y2="140"/><line x1="40.0" y1="0" x2="-3040.0" y2="140"/><line x1="80.0" y1="0" x2="-2780.0" y2="140"/><line x1="120.0" y1="0" x2="-2520.0" y2="140"/><line x1="160.0" y1="0" x2="-2260.0" y2="140"/><line x1="200.0" y1="0" x2="-2000.0" y2="140"/><line x1="240.0" y1="0" x2="-1740.0" y2="140"/><line x1="280.0" y1="0" x2="-1480.0" y2="140"/><line x1="320.0" y1="0" x2="-1220.0" y2="140"/><line x1="360.0" y1="0" x2="-960.0" y2="140"/><line x1="400.0" y1="0" x2="-700.0" y2="140"/><line x1="440.0" y1="0" x2="-440.0" y2="140"/><line x1="480.0" y1="0" x2="-180.0" y2="140"/><line x1="520.0" y1="0" x2="80.0" y2="140"/><line x1="560.0" y1="0" x2="340.0" y2="140"/><line x1="600.0" y1="0" x2="600.0" y2="140"/><line x1="640.0" y1="0" x2="860.0" y2="140"/><line x1="680.0" y1="0" x2="1120.0" y2="140"/><line x1="720.0" y1="0" x2="1380.0" y2="140"/><line x1="760.0" y1="0" x2="1640.0" y2="140"/><line x1="800.0" y1="0" x2="1900.0" y2="140"/><line x1="840.0" y1="0" x2="2160.0" y2="140"/><line x1="880.0" y1="0" x2="2420.0" y2="140"/><line x1="920.0" y1="0" x2="2680.0" y2="140"/><line x1="960.0" y1="0" x2="2940.0" y2="140"/><line x1="1000.0" y1="0" x2="3200.0" y2="140"/><line x1="1040.0" y1="0" x2="3460.0" y2="140"/><line x1="1080.0" y1="0" x2="3720.0" y2="140"/><line x1="1120.0" y1="0" x2="3980.0" y2="140"/><line x1="1160.0" y1="0" x2="4240.0" y2="140"/><line x1="1200.0" y1="0" x2="4500.0" y2="140"/><line x1="1240.0" y1="0" x2="4760.0" y2="140"/></g>
    <rect y="-2" width="1200" height="50" fill="url(#fade)"/>
    <rect y="-1" width="1200" height="2" fill="url(#hz)"/>
  </g>
  <rect width="1200" height="440" fill="url(#noise)"/>
  <text class="tag" x="600" y="84" text-anchor="middle">INDIE BUILDER · STUDENT · ALBA IULIA, RO</text>
  <g filter="url(#glow)">
    <text class="name" x="609" y="214" text-anchor="middle" fill="url(#nameb)">MATEO
      <animate attributeName="fill-opacity" values="1;0.92;1;1;0.85;1" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
    <text x="600" y="262" text-anchor="middle" font-size="14" fill="#f72585" letter-spacing="3">~/currently $</text>
    <text class="rot" style="animation-delay:0.0s" x="600" y="296" text-anchor="middle">shipping a GTA 6 companion platform</text><text class="rot" style="animation-delay:3.2s" x="600" y="296" text-anchor="middle">teaching AI to referee arguments</text><text class="rot" style="animation-delay:6.4s" x="600" y="296" text-anchor="middle">building multiplayer for Geometry Dash</text><text class="rot" style="animation-delay:9.600000000000001s" x="600" y="296" text-anchor="middle">turning side projects into products</text>
  </g>
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#ffffff" opacity="0.05"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</g>
</svg>