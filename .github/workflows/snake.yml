# Goes in: .github/workflows/snake.yml (inside your USERNAME/USERNAME repo)
name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#f72585&color_dots=#ebedf0,#e0c3fc,#c77dff,#9d4edd,#7b2cbf
            dist/snake-dark.svg?palette=github-dark&color_snake=#f72585&color_dots=#161b22,#3c096c,#5a189a,#9d4edd,#f72585

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
